<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7db9ff"/>
      <stop offset="1" stop-color="#b5dbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb62e"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="250" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eefc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- sun, peeking out behind the cloud -->
    <g stroke="#ffc83d" stroke-width="22" stroke-linecap="round">
      <line x1="338" y1="62" x2="338" y2="92"/>
      <line x1="338" y1="278" x2="338" y2="248"/>
      <line x1="230" y1="170" x2="260" y2="170"/>
      <line x1="446" y1="170" x2="416" y2="170"/>
      <line x1="262" y1="94" x2="283" y2="115"/>
      <line x1="414" y1="94" x2="393" y2="115"/>
      <line x1="414" y1="246" x2="393" y2="225"/>
    </g>
    <circle cx="338" cy="170" r="70" fill="url(#sun)"/>

    <!-- cloud shadow -->
    <g fill="#3f78c9" opacity="0.35" filter="url(#soft)" transform="translate(0 16)">
      <rect x="82" y="290" width="348" height="112" rx="56"/>
      <circle cx="190" cy="290" r="78"/>
      <circle cx="298" cy="266" r="96"/>
    </g>

    <!-- cloud -->
    <g fill="url(#cloud)">
      <rect x="82" y="290" width="348" height="112" rx="56"/>
      <circle cx="190" cy="290" r="78"/>
      <circle cx="298" cy="266" r="96"/>
    </g>
  </g>
</svg>
